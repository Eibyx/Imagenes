name: MTZ Forge

on:
  push:
    paths: ["MtzForge/**", ".github/workflows/mtzforge.yml"]
  pull_request:
    paths: ["MtzForge/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MtzForge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (JVM + Robolectric)
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      # Firma de publicación opcional. Secrets necesarios:
      #   MTZFORGE_KEYSTORE_BASE64, MTZFORGE_KEYSTORE_PASSWORD, MTZFORGE_KEY_ALIAS, MTZFORGE_KEY_PASSWORD
      # Sin ellos, el APK release se firma con la clave de depuración.
      - name: Preparar keystore
        env:
          KS: ${{ secrets.MTZFORGE_KEYSTORE_BASE64 }}
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MTZFORGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APKs
        env:
          MTZFORGE_KEYSTORE_PASSWORD: ${{ secrets.MTZFORGE_KEYSTORE_PASSWORD }}
          MTZFORGE_KEY_ALIAS: ${{ secrets.MTZFORGE_KEY_ALIAS }}
          MTZFORGE_KEY_PASSWORD: ${{ secrets.MTZFORGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :sample-iconpack:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mtzforge-apks
          path: |
            MtzForge/app/build/outputs/apk/release/*.apk
            MtzForge/sample-iconpack/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            MtzForge/core/build/reports/tests
            MtzForge/app/build/reports/tests
